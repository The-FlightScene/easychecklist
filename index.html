<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The FlightScene - EFB Normal Checklists</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0B0F19;
      --bg-card: #151C2C;
      --bg-card-hover: #1C263B;
      --bg-card-active: #222E47;
      --accent-cyan: #00E5FF;
      --accent-green: #00E676;
      --accent-amber: #FFB300;
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --border-color: #26334D;
      --border-accent: #1E293B;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      --font-main: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      background: rgba(21, 28, 44, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent-cyan), #0088FF);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 800;
      font-size: 18px;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
    }

    .brand-title {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.5px;
      color: #FFF;
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }

    .brand-title span {
      font-size: 10px;
      color: var(--accent-cyan);
      letter-spacing: 1.5px;
      font-weight: 700;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-cyan);
      color: #FFF;
    }

    .btn-primary {
      background: var(--accent-cyan);
      color: #000;
      border: none;
    }

    .btn-primary:hover {
      background: #33ECFF;
      color: #000;
      box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
    }

    /* MAIN CONTAINER */
    main {
      flex: 1;
      padding: 24px;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    /* HOME SCREEN */
    #home-view {
      display: block;
    }

    .hero-title {
      margin-bottom: 24px;
    }

    .hero-title h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .hero-title p {
      color: var(--text-secondary);
      font-size: 14px;
      margin-top: 4px;
    }

    .aircraft-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .aircraft-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .aircraft-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--border-color);
      transition: background 0.2s ease;
    }

    .aircraft-card:hover {
      transform: translateY(-4px);
      border-color: rgba(0, 229, 255, 0.4);
      background: var(--bg-card-hover);
      box-shadow: var(--shadow);
    }

    .aircraft-card:hover::before {
      background: var(--accent-cyan);
    }

    .aircraft-manufacturer {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-cyan);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .aircraft-name {
      font-size: 20px;
      font-weight: 700;
      color: #FFF;
      margin-bottom: 12px;
    }

    .aircraft-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-secondary);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 12px;
      margin-top: 12px;
    }

    .badge {
      background: rgba(255, 255, 255, 0.06);
      padding: 3px 8px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .card-progress {
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin-top: 10px;
      overflow: hidden;
    }

    .card-progress-bar {
      height: 100%;
      background: var(--accent-green);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* CHECKLIST VIEW */
    #checklist-view {
      display: none;
    }

    .checklist-header {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .checklist-info h2 {
      font-size: 24px;
      font-weight: 800;
      color: #FFF;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .checklist-info p {
      color: var(--text-secondary);
      font-size: 13px;
      margin-top: 4px;
    }

    .progress-container {
      flex: 1;
      max-width: 320px;
      min-width: 200px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }

    .progress-bar-bg {
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
      width: 0%;
      transition: width 0.3s ease;
    }

    /* BLOCKS & TABLES */
    .blocks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 20px;
      align-items: start;
    }

    .checklist-block {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .checklist-block.completed {
      border-color: rgba(0, 230, 118, 0.4);
    }

    .block-header {
      background: #182235;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      border-bottom: 1px solid transparent;
      transition: background 0.2s ease;
    }

    .checklist-block.open .block-header {
      border-bottom-color: var(--border-color);
    }

    .block-header:hover {
      background: var(--bg-card-hover);
    }

    .block-title-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .block-title {
      font-size: 14px;
      font-weight: 700;
      color: #FFF;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .block-counter {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      background: rgba(0,0,0,0.2);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .toggle-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease;
      color: var(--text-secondary);
    }

    .checklist-block.open .toggle-icon {
      transform: rotate(180deg);
      color: var(--accent-cyan);
    }

    .block-content {
      display: none;
      padding: 0;
    }

    .checklist-block.open .block-content {
      display: block;
    }

    /* ITEM ROWS */
    .checklist-table {
      width: 100%;
      border-collapse: collapse;
    }

    .checklist-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .checklist-row:last-child {
      border-bottom: none;
    }

    .checklist-row:hover {
      background: rgba(0, 229, 255, 0.04);
    }

    .checklist-row.checked {
      background: rgba(0, 230, 118, 0.05);
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      padding-right: 12px;
    }

    .checkbox {
      width: 18px;
      height: 18px;
      border: 2px solid var(--text-muted);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .checklist-row.checked .checkbox {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: #000;
    }

    .checkbox svg {
      display: none;
      width: 12px;
      height: 12px;
      stroke-width: 3;
    }

    .checklist-row.checked .checkbox svg {
      display: block;
    }

    .item-challenge {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      transition: color 0.2s ease;
    }

    .checklist-row.checked .item-challenge {
      color: var(--text-muted);
      text-decoration: line-through;
    }

    .item-response {
      font-size: 12px;
      font-family: var(--font-mono);
      font-weight: 700;
      color: var(--accent-cyan);
      text-align: right;
      padding: 3px 8px;
      background: rgba(0, 229, 255, 0.08);
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .checklist-row.checked .item-response {
      color: var(--accent-green);
      background: rgba(0, 230, 118, 0.1);
      text-decoration: line-through;
      opacity: 0.7;
    }

    /* FOOTER BRANDING */
    footer {
      background: #080B12;
      border-top: 1px solid var(--border-color);
      padding: 18px 24px;
      text-align: center;
      margin-top: auto;
    }

    .footer-brand {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: var(--text-secondary);
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .footer-brand span {
      color: var(--accent-cyan);
    }

    @media (max-width: 768px) {
      .blocks-grid {
        grid-template-columns: 1fr;
      }
      main {
        padding: 16px;
      }
      .checklist-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .progress-container {
        max-width: 100%;
        width: 100%;
      }
    }
  </style>
</head>

          <div class="progress-bar-bg">

        </div>
        <div style="display: flex; gap: 8px; width: 100%; justify-content: flex-end; margin-top: 8px;">
          <button class="btn" onclick="toggleAllBlocks(true)">Alles Uitklappen</button>
          <button class="btn" onclick="toggleAllBlocks(false)">Alles Inklappen</button>
          <button class="btn btn-primary" onclick="resetCurrentChecklist()">Reset Vinkjes</button>
        </div>
      </div>

      <div class="blocks-grid" id="blocks-container"></div>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-brand">
      A <span>The FlightScene Sim Solutions</span> Product

            { c: "CABIN SIGNS", r: "AS RQRD" },
            { c: "TEMP PROBE HEAT", r: "CHECKED ON" },
            { c: "HYDRAULIC PANEL", r: "SET" },
            { c: "FUEL PANEL", r: "SET" },
            { c: "ECS PANEL", r: "CHECKED" },
            { c: "APU", r: "OFF" }
          ],
          "DESCENT": [
            { c: "FLIGHT INSTRUMENTS", r: "CHECKED" },
            { c: "LANDING DATA", r: "CHECKED & ON" },
            { c: "ANNUNCIATORS", r: "RECALL" },
            { c: "BRIEFING", r: "CONFIRMED" },
            { c: "ECS PANEL", r: "SET" }
          ],
          "APPROACH": [
            { c: "PAX SIGNS", r: "ON" },
            { c: "EXTERIOR LIGHTS", r: "AS RQRD" },
            { c: "ALTIMETERS", r: "SET & CHECKED" },
            { c: "FLAPS/SLATS", r: "SET" },
            { c: "RAD/NAV", r: "RADIO" },
            { c: "FUEL PANEL", r: "SET & CHECKED" }
          ],
          "LANDING": [
            { c: "ALTIMETER", r: "SET CONFIRMED" },
            { c: "LANDING GEAR", r: "DOWN 3 GRN" },
            { c: "CONTINUOUS IGNITION", r: "AS RQRD" },
            { c: "CABIN", r: "INFORMED" },
            { c: "HYDRAULIC PANEL", r: "SET" },
            { c: "BRAKE SYSTEM & ANTISKID", r: "CHECKED" },
            { c: "FLAPS", r: "SET" },
            { c: "DLC/ALPHA", r: "CHECKED" }
          ],
          "AFTER LANDING": [
            { c: "ANTI ICE", r: "OFF" },
            { c: "WINDSHIELD HEAT", r: "IDLE" },
            { c: "AIR DATA SENSOR", r: "OFF" },
            { c: "CONTINUOUS IGNITION", r: "OFF" },
            { c: "ANTISKID", r: "OFF" },
            { c: "EXTERIOR LIGHTS", r: "AS RQRD" },
            { c: "SPEED BRAKE LEVER", r: "FORWARD" },
            { c: "FLAPS/SLATS", r: "UP & RETRACTED" },
            { c: "TRIM", r: "ZERO" },
            { c: "RADAR & TRANSPONDER", r: "STANDBY" },
            { c: "ELECTRICAL PANEL", r: "SET" },
            { c: "ECS STATUS", r: "CHECKED" },
            { c: "APU", r: "ON" },
            { c: "BRAKE SYSTEM", r: "CHECKED" }
          ],
          "SHUTDOWN": [
            { c: "ENGINE RUNDOWN", r: "NORMAL" },
            { c: "PARKING BRAKE", r: "ON" },
            { c: "STANDBY POWER", r: "OFF/STANDBY" },
            { c: "EXTERIOR LIGHTS", r: "AS RQRD" },
            { c: "PAX SIGNS", r: "OFF" },
            { c: "MAX INDICATOR", r: "RESET" },
            { c: "ATM'S", r: "OFF" },
            { c: "HYDRAULIC PANEL", r: "SET" },
            { c: "BATTERY SWITCH", r: "OFF" },
            { c: "FUEL PANEL", r: "SET" },
            { c: "ECS PANEL", r: "CHECKED" }
          ],
          "SECURING THE AIRCRAFT": [
            { c: "WINDOW HEAT", r: "OFF" },
            { c: "RADAR", r: "OFF" },
            { c: "CREW OXYGEN", r: "OFF" },
            { c: "INTERIOR LIGHTS", r: "DIM/OFF" }
          ]
        }
      }
    ];

    // STATE STORE
    let currentAircraftId = null;
    let checkedState = {}; // { aircraftId: { itemKey: boolean } }
    let openBlocksState = {}; // { aircraftId: { blockIndex: boolean } }

    // RENDER HOME SCREEN
    function renderHomeScreen() {
      const grid = document.getElementById('aircraft-grid');
      grid.innerHTML = '';

      aircraftData.forEach(ac => {
        // Calculate progress
        let totalItems = 0;
        let checkedItems = 0;
        const acState = checkedState[ac.id] || {};

        Object.keys(ac.checklists).forEach(blockTitle => {
          ac.checklists[blockTitle].forEach((item, idx) => {
            totalItems++;
            const key = `${blockTitle}_${idx}`;
            if (acState[key]) checkedItems++;
          });
        });

        const percent = totalItems > 0 ? Math.round((checkedItems / totalItems) * 100) : 0;

        const card = document.createElement('div');
        card.className = 'aircraft-card';
        card.onclick = () => selectAircraft(ac.id);

        card.innerHTML = `
          <div>
            <div class="aircraft-manufacturer">${ac.manufacturer}</div>
            <div class="aircraft-name">${ac.name}</div>
            <div class="badge">${ac.rev}</div>
          </div>
          <div>
            <div class="aircraft-meta">
              <span>Voortgang</span>
              <span style="font-weight: 700; color: ${percent === 100 ? 'var(--accent-green)' : 'var(--accent-cyan)'}">${percent}%</span>
            </div>
            <div class="card-progress">
              <div class="card-progress-bar" style="width: ${percent}%"></div>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // SELECT AIRCRAFT
    function selectAircraft(id) {
      currentAircraftId = id;
      const ac = aircraftData.find(a => a.id === id);
      if (!ac) return;

      document.getElementById('current-aircraft-title').innerText = ac.name;
      document.getElementById('current-aircraft-sub').innerText = `${ac.manufacturer} • ${ac.rev} • Normal Checklist`;

      document.getElementById('home-view').style.display = 'none';
      document.getElementById('checklist-view').style.display = 'block';
      document.getElementById('btn-back').style.display = 'flex';

      // Initialize state for open blocks if not present
      if (!openBlocksState[id]) {
        openBlocksState[id] = {};
        // Default first block open
        openBlocksState[id][0] = true;
      }

      renderChecklistBlocks();
      updateTotalProgress();
    }

    // SHOW HOME
    function showHome() {
      document.getElementById('home-view').style.display = 'block';
      document.getElementById('checklist-view').style.display = 'none';
      document.getElementById('btn-back').style.display = 'none';
      renderHomeScreen();
    }

    // RENDER CHECKLIST BLOCKS
    function renderChecklistBlocks() {
      const container = document.getElementById('blocks-container');
      container.innerHTML = '';

      const ac = aircraftData.find(a => a.id === currentAircraftId);
      if (!ac) return;

      const acCheckedState = checkedState[currentAircraftId] || {};
      const acOpenState = openBlocksState[currentAircraftId] || {};

      const blockTitles = Object.keys(ac.checklists);

      blockTitles.forEach((title, blockIdx) => {
        const items = ac.checklists[title];
        let blockCheckedCount = 0;

        items.forEach((item, idx) => {
          const key = `${title}_${idx}`;
          if (acCheckedState[key]) blockCheckedCount++;
        });

        const isCompleted = items.length > 0 && blockCheckedCount === items.length;
        const isOpen = acOpenState[blockIdx] === true;

        const blockEl = document.createElement('div');
        blockEl.className = `checklist-block ${isOpen ? 'open' : ''} ${isCompleted ? 'completed' : ''}`;
        blockEl.id = `block-${blockIdx}`;

        // Header
        const headerEl = document.createElement('div');
        headerEl.className = 'block-header';
        headerEl.onclick = () => toggleBlock(blockIdx);

        headerEl.innerHTML = `
          <div class="block-title-area">
            <div class="block-title">${title}</div>
            <div class="block-counter">${blockCheckedCount}/${items.length}</div>
          </div>
          <div class="toggle-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
          </div>
        `;

        // Content
        const contentEl = document.createElement('div');
        contentEl.className = 'block-content';

        const table = document.createElement('div');
        table.className = 'checklist-table';

        items.forEach((item, itemIdx) => {
          const key = `${title}_${itemIdx}`;
          const isChecked = acCheckedState[key] === true;

          const row = document.createElement('div');
          row.className = `checklist-row ${isChecked ? 'checked' : ''}`;
          row.onclick = (e) => {
            e.stopPropagation();
            toggleItem(title, itemIdx);
          };

          row.innerHTML = `
            <div class="item-left">
              <div class="checkbox">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </div>
              <div class="item-challenge">${item.c}</div>
            </div>
            <div class="item-response">${item.r}</div>
          `;

          table.appendChild(row);
        });

        contentEl.appendChild(table);
        blockEl.appendChild(headerEl);
        blockEl.appendChild(contentEl);

        container.appendChild(blockEl);
      });
    }

    // TOGGLE BLOCK
    function toggleBlock(blockIdx) {
      if (!openBlocksState[currentAircraftId]) openBlocksState[currentAircraftId] = {};
      openBlocksState[currentAircraftId][blockIdx] = !openBlocksState[currentAircraftId][blockIdx];
      renderChecklistBlocks();
    }

    // TOGGLE ALL BLOCKS
    function toggleAllBlocks(open) {
      const ac = aircraftData.find(a => a.id === currentAircraftId);
      if (!ac) return;
      if (!openBlocksState[currentAircraftId]) openBlocksState[currentAircraftId] = {};

      Object.keys(ac.checklists).forEach((_, idx) => {
        openBlocksState[currentAircraftId][idx] = open;
      });

      renderChecklistBlocks();
    }

    // TOGGLE ITEM
    function toggleItem(blockTitle, itemIdx) {
      if (!checkedState[currentAircraftId]) checkedState[currentAircraftId] = {};
      const key = `${blockTitle}_${itemIdx}`;
      checkedState[currentAircraftId][key] = !checkedState[currentAircraftId][key];

      renderChecklistBlocks();
      updateTotalProgress();
    }

    // UPDATE TOTAL PROGRESS
    function updateTotalProgress() {
      const ac = aircraftData.find(a => a.id === currentAircraftId);
      if (!ac) return;

      let totalItems = 0;
      let checkedItems = 0;
      const acState = checkedState[currentAircraftId] || {};

      Object.keys(ac.checklists).forEach(blockTitle => {
        ac.checklists[blockTitle].forEach((item, idx) => {
          totalItems++;
          const key = `${blockTitle}_${idx}`;
          if (acState[key]) checkedItems++;
        });
      });

      const percent = totalItems > 0 ? Math.round((checkedItems / totalItems) * 100) : 0;
      document.getElementById('total-progress-percent').innerText = `${percent}%`;
      document.getElementById('total-progress-bar').style.width = `${percent}%`;
    }

    // RESET CURRENT CHECKLIST
    function resetCurrentChecklist() {
      if (!currentAircraftId) return;
      checkedState[currentAircraftId] = {};
      renderChecklistBlocks();
      updateTotalProgress();
    }

    // INIT
    renderHomeScreen();
  </script>
</body>
